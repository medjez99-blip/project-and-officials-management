# ═════════════════════════════════════════════════════════════
# Netlify — static site configuration
# ═════════════════════════════════════════════════════════════

[build]
  publish = "."
  # command = ""              # static site — no build step

[build.environment]
  NODE_VERSION = "20"

# ── SPA fallback (deep links → index.html) ──
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Security headers ──
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options                  = "DENY"
    X-Content-Type-Options           = "nosniff"
    Referrer-Policy                  = "strict-origin-when-cross-origin"
    Permissions-Policy               = "geolocation=(self), camera=(self), microphone=(), payment=(), usb=()"
    Strict-Transport-Security        = "max-age=63072000; includeSubDomains; preload"
    Cross-Origin-Opener-Policy       = "same-origin"
    Cross-Origin-Resource-Policy     = "same-origin"
    # Content-Security-Policy — commented out by default (test in browser console first)
    # Uncomment after confirming everything works with it enabled.
    #
    # Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# ── HTML: never cache (so SW updates roll out) ──
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# ── Service worker: no cache + scope header ──
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control          = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

# ── Config: no cache (so key rotation propagates) ──
[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# ── Manifest ──
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# ── Static assets: long cache ──
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=604800"